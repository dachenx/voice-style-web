name: Module quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      application: ${{ steps.scope.outputs.application }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Basic checks and governance regression
        run: |
          python3 scripts/quality_gate.py quick
          python3 -m unittest discover -s tests -v
      - name: Select application checks
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: python3 scripts/ci_scope.py

  backend:
    needs: quality
    if: needs.quality.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.lock
      - name: Backend checks
        run: |
          set -o pipefail
          python3 scripts/check_app.py --suite backend 2>&1 | tee backend-checks.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-checks
          path: backend-checks.log
          retention-days: 7

  frontend:
    needs: quality
    if: needs.quality.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Frontend checks and build
        run: |
          set -o pipefail
          { npm --prefix frontend run lint && npm --prefix frontend run typecheck && npm --prefix frontend run build; } 2>&1 | tee frontend-checks.log
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-checks
          path: frontend-checks.log
          retention-days: 7

  browser:
    needs: [quality, frontend]
    if: needs.quality.outputs.application == 'true'
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.lock
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
      - name: Browser acceptance
        env:
          VOICE_E2E_RUN_ID: ci-${{ matrix.project }}
        run: |
          set -o pipefail
          python3 scripts/check_app.py --suite browser --project=${{ matrix.project }} 2>&1 | tee browser-checks.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.project }}
          include-hidden-files: true
          path: |
            browser-checks.log
            .quality-local/playwright-results/ci-${{ matrix.project }}/
            .quality-local/playwright-report/ci-${{ matrix.project }}/
          retention-days: 7
